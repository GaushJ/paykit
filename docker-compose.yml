# Local development stack: Postgres + migrations + the standalone service.
# Not a production deployment: use a managed Postgres and real secrets there.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paykit
      # Override via a shell env var or .env; the default is for local dev only.
      POSTGRES_PASSWORD: ${PAYKIT_PG_PASSWORD:-paykit}
      POSTGRES_DB: paykit
    ports:
      # Bound to loopback only, so the dev database isn't exposed on the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - paykit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paykit"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["paykit", "db", "upgrade"]
    environment:
      PAYKIT_DATABASE_URL: postgresql+asyncpg://paykit:${PAYKIT_PG_PASSWORD:-paykit}@postgres:5432/paykit
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  service:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PAYKIT_DATABASE_URL: postgresql+asyncpg://paykit:${PAYKIT_PG_PASSWORD:-paykit}@postgres:5432/paykit
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  paykit_postgres_data:
